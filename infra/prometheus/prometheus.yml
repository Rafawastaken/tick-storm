global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Backend corre no host (via `make run` / Air), não em container.
  - job_name: "tickstorm-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8080"]
