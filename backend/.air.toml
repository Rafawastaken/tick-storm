root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api.exe ./cmd/api"
  entrypoint = "./tmp/api.exe"
  include_ext = ["go", "tpl", "tmpl", "html", "sql", "yaml", "yml"]
  exclude_dir = ["tmp", "database/migrations", ".idea"]
  exclude_regex = ['_test\.go', '\.sql\.go$']
  delay = 200
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
