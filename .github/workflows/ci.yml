name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: root
  POSTGRES_PASSWORD: toor
  POSTGRES_DB: tickstorm

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Ephemeral Postgres for this job, reachable on localhost:5432.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: toor
          POSTGRES_DB: tickstorm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d tickstorm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      # Pinned: @latest makes the job non-reproducible — a new release breaks
      # CI with no change to this repo. sqlc is pinned in go.mod as a tool;
      # migrate cannot be, since its CLI needs build tags to register drivers.
      - name: Install golang-migrate
        run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.0

      - name: Run migrations
        run: migrate -path database/migrations -database "$DATABASE_URL" up
        env:
          DATABASE_URL: postgresql://root:toor@localhost:5432/tickstorm?sslmode=disable

      - name: Verify generated code is committed
        run: go tool sqlc diff
